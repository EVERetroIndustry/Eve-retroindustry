name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller eve_retroindustry.spec --noconfirm

      - name: Smoke-test the built app (headless)
        timeout-minutes: 3
        run: |
          & "./dist/EVE_Retroindustry/EVE_Retroindustry.exe" --smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create ZIP (portable)
        shell: pwsh
        run: Compress-Archive -Path dist/EVE_Retroindustry -DestinationPath EVE_Retroindustry-${{ github.ref_name }}-win64-portable.zip

      # Inno Setup is not pre-installed on the windows-2025 runner image, so pull
      # it in. This only affects the machine that COMPILES the installer - the
      # resulting setup.exe runs on any supported Windows.
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          # Tag runs give "v1.2.3"; a manual workflow_dispatch gives a branch name,
          # which VersionInfoVersion can't parse - fall back so the compile can
          # still be validated.
          $ver = "${{ github.ref_name }}".TrimStart('v')
          if ($ver -notmatch '^\d+\.\d+\.\d+$') {
            Write-Host "ref '${{ github.ref_name }}' is not a version tag - building as 0.0.0"
            $ver = '0.0.0'
          }
          # Braces are required around the variable name: "$env:ProgramFiles(x86)"
          # parses as $env:ProgramFiles followed by a literal "(x86)".
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after installing Inno Setup" }
          & $iscc /DAppVersion=$ver installer\eve_retroindustry.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Keep the artifact flat: listing a path inside installer/ makes
          # upload-artifact preserve that folder, and the release job's
          # artifacts/* globs would then miss it.
          Move-Item installer\*setup.exe . -Force
          Get-ChildItem *setup.exe | ForEach-Object { Write-Host "built: $($_.Name) ($([math]::Round($_.Length/1MB,1)) MB)" }

      # The installer ships inside a ZIP: browsers flag a downloaded .exe as
      # "not commonly downloaded", but not an archive. It does NOT remove the
      # warning entirely - Windows propagates Mark-of-the-Web to extracted files,
      # so SmartScreen can still prompt when setup.exe is launched - but it keeps
      # the download itself clean and gets through proxies that block .exe.
      # (Zipping gains no size: Inno already LZMA2-compressed the payload.)
      - name: Wrap installer in a ZIP
        shell: pwsh
        run: |
          $exe = (Get-ChildItem *setup.exe)[0]
          $zip = "EVE_Retroindustry-${{ github.ref_name }}-win64-setup.zip"
          # installer/SETUP_README.txt rides along as README.txt. A tester hit
          # Inno's "Unable to execute file in the temporary directory ... Error 5",
          # which is a %TEMP%/antivirus problem on the machine rather than a broken
          # build - and the fix every web guide gives ("run as administrator") is
          # wrong for a per-user installer. The note explains that and points at
          # the portable build. Kept in a file, not inlined here: unindented
          # here-string lines would break this YAML block scalar.
          Copy-Item installer\SETUP_README.txt README.txt -Force
          Compress-Archive -Path $exe.FullName, README.txt -DestinationPath $zip -Force
          Write-Host "packed: $zip ($([math]::Round((Get-Item $zip).Length/1MB,1)) MB)"
          # Listing is informational only - never fail a release over it.
          try {
            $z = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip).Path)
            foreach ($e in $z.Entries) { Write-Host "  entry: $($e.FullName)" }
            $z.Dispose()
          } catch { Write-Host "  (could not list entries: $_)" }

      - uses: actions/upload-artifact@v4
        with:
          name: win64
          path: |
            EVE_Retroindustry-${{ github.ref_name }}-win64-portable.zip
            EVE_Retroindustry-${{ github.ref_name }}-win64-setup.zip

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system Qt runtime deps (so PyInstaller can bundle them)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-sync1 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xkb1 libdbus-1-3 libnss3 libxdamage1 \
            libxcomposite1 libxrandr2 libxtst6 libasound2t64 libfontconfig1

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller eve_retroindustry.spec --noconfirm

      - name: Smoke-test the built app (headless)
        timeout-minutes: 3
        env:
          QT_QPA_PLATFORM: offscreen
        # Full smoke incl. QtWebEngine import. The runner has no system Qt, so a
        # successful import proves the bundle is self-contained.
        run: ./dist/EVE_Retroindustry/EVE_Retroindustry --smoke

      - name: Create ZIP
        run: cd dist && zip -r ../EVE_Retroindustry-${{ github.ref_name }}-linux-portable.zip EVE_Retroindustry

      - name: Build AppImage
        run: |
          # ── AppDir structure ─────────────────────────────────────────────
          mkdir -p AppDir
          cp -r dist/EVE_Retroindustry/. AppDir/

          # AppRun - entry point called by the AppImage runtime
          cat > AppDir/AppRun << 'APPRUN'
          #!/bin/bash
          APPDIR="$(dirname "$(readlink -f "$0")")"
          exec "${APPDIR}/EVE_Retroindustry" "$@"
          APPRUN
          chmod +x AppDir/AppRun

          # Desktop file (required by AppImage spec)
          cat > AppDir/eve-retroindustry.desktop << 'DESKTOP'
          [Desktop Entry]
          Name=EVE Retroindustry
          Comment=EVE Online industry calculator
          Exec=EVE_Retroindustry
          Icon=eve-retroindustry
          Type=Application
          Categories=Game;Utility;
          DESKTOP

          # Icon - convert bundled .ico to 256×256 PNG
          python3 -c "
          from PIL import Image
          img = Image.open('assets/icon.ico')
          # Pick the largest available frame
          sizes = img.info.get('sizes', set())
          target = max(sizes, key=lambda s: s[0]) if sizes else (64, 64)
          img = img.resize((256, 256), Image.LANCZOS)
          img.convert('RGBA').save('AppDir/eve-retroindustry.png')
          "

          # ── appimagetool + FUSE3-compatible runtime ───────────────────────
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" \
               -O appimagetool
          chmod +x appimagetool

          # Use the type2-runtime which supports both FUSE2 and FUSE3.
          # Arch-based distros (Garuda, Manjaro) ship fuse3 but not fuse2 by
          # default - the standard AppImageKit runtime only loads libfuse.so.2
          # and fails there.
          wget -q "https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64" \
               -O runtime-x86_64 \
          || wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/runtime-x86_64" \
               -O runtime-x86_64
          chmod +x runtime-x86_64

          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool --no-appstream \
               --runtime-file runtime-x86_64 \
               AppDir "EVE_Retroindustry-${{ github.ref_name }}-linux.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            EVE_Retroindustry-${{ github.ref_name }}-linux-portable.zip
            EVE_Retroindustry-${{ github.ref_name }}-linux.AppImage

  build-android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare shared Python + assets
        working-directory: android-poc
        run: bash prepare.sh

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Derive version from tag
        id: ver
        run: |
          TAG="${{ github.ref_name }}"
          VN="${TAG#v}"
          IFS='.' read -r MA MI PA <<< "$VN"
          # 10# forces base 10: bash reads a leading zero as octal, so the
          # two-digit patch we release with ("0.11.08") would abort the build.
          VC=$(( 10#${MA:-0}*10000 + 10#${MI:-0}*100 + 10#${PA:-0} ))
          echo "name=$VN" >> "$GITHUB_OUTPUT"
          echo "code=$VC" >> "$GITHUB_OUTPUT"
          echo "Android version $VN ($VC)"

      - name: Build signed release APK
        working-directory: android-poc
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ steps.ver.outputs.code }}
          ANDROID_VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Stage APK + version.json (stable names for releases/latest/download)
        run: |
          cp android-poc/app/build/outputs/apk/release/app-release.apk EveRetroindustry.apk
          cat > version.json <<EOF
          {"versionCode": ${{ steps.ver.outputs.code }}, "versionName": "${{ steps.ver.outputs.name }}", "apkUrl": "https://github.com/EVERetroIndustry/Eve-retroindustry/releases/latest/download/EveRetroindustry.apk"}
          EOF
          cat version.json

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            EveRetroindustry.apk
            version.json

  release:
    needs: [build-windows, build-linux, build-android]
    # Tag pushes only. A manual workflow_dispatch run is for verifying that the
    # builds (and the installer) compile - without it this job would try to create
    # a release named after the branch.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts/

      - name: Upload Release Assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "EVE Retroindustry ${{ github.ref_name }}" \
            --generate-notes \
            artifacts/*.zip \
            artifacts/*.AppImage \
            artifacts/EveRetroindustry.apk \
            artifacts/version.json \
            sde_base.db \
          || gh release upload ${{ github.ref_name }} \
            artifacts/*.zip \
            artifacts/*.AppImage \
            artifacts/EveRetroindustry.apk \
            artifacts/version.json \
            sde_base.db \
            --clobber
